# Universal Forwarder inputs for a Windows host.
# Place in: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Indexes "wineventlog" and "sysmon" must already exist on the Splunk server.

[WinEventLog://Security]
disabled = 0
index = wineventlog

[WinEventLog://System]
disabled = 0
index = wineventlog

[WinEventLog://Application]
disabled = 0
index = wineventlog

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
